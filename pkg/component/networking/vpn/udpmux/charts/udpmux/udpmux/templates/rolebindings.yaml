apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: udp-mux-secret-reader-binding
  namespace: {{ .Release.Namespace }}
  labels:
{{ .Values.labels | toYaml | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: udp-mux-secret-reader
subjects:
- kind: ServiceAccount
  name: udp-mux-service-account
